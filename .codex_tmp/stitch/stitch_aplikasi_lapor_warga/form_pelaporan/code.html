<!-- Script for Interactions -->
<script>
        function selectChip(btn) {
            const container = btn.parentElement;
            container.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
            });
            btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
        }

        function selectSegment(btn) {
            const container = btn.parentElement;
            container.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                b.classList.add('text-secondary', 'hover:bg-surface-container-high');
            });
            btn.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
            btn.classList.remove('text-secondary', 'hover:bg-surface-container-high');
        }

        // Micro-interaction for form focus
        document.querySelectorAll('textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.classList.add('ring-1', 'ring-primary/20');
            });
            el.addEventListener('blur', () => {
                el.parentElement.classList.remove('ring-1', 'ring-primary/20');
            });
        });
    </script>
