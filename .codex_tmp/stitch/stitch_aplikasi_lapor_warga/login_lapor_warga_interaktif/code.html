<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .bg-mesh {
            background-color: #f8f9fa;
            background-image: radial-gradient(at 0% 0%, rgba(193, 236, 212, 0.3) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(148, 212, 177, 0.2) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        
        .input-highlight:focus-within {
            box-shadow: 0 0 0 4px rgba(1, 45, 29, 0.08);
        }
    </style>

<body class="bg-mesh min-h-screen flex items-center justify-center p-gutter font-body-lg text-on-surface">
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-lg text-center animate-fade-up stagger-1">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-primary-container mb-md shadow-lg transform transition-transform hover:scale-105 duration-300">
<span class="material-symbols-outlined text-primary-fixed-dim text-5xl" data-icon="eco">eco</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary md:font-headline-lg md:text-headline-lg tracking-tight">Lapor Warga</h1>
<p class="font-body-sm text-body-sm text-secondary mt-xs">Membangun lingkungan lebih asri dan tertib bersama</p>
</div>
<!-- Login Container -->
<div class="w-full glass-card border border-surface-container-highest rounded-xl p-md md:p-lg shadow-xl shadow-primary/5 animate-fade-up stagger-2">
<form action="#" class="space-y-md" onsubmit="event.preventDefault();">
<!-- Input Fields -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="identity">Email atau Username</label>
<div class="relative group input-highlight rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all duration-200 font-body-lg text-body-lg placeholder:text-outline-variant/60" id="identity" placeholder="user@laporwarga.id" type="text">
</div>
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="password">Kata Sandi</label>
<div class="relative group input-highlight rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all duration-200 font-body-lg text-body-lg placeholder:text-outline-variant/60" id="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors p-1" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-end">
<a class="font-label-caps text-label-caps text-on-tertiary-fixed-variant hover:text-primary transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<!-- Primary Action -->
<button class="group relative w-full py-4 bg-primary text-on-primary font-button text-button rounded-lg shadow-md hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 active:scale-[0.98] overflow-hidden" type="submit">
<span class="relative z-10">Masuk ke Layanan</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</button>
</form>
<div class="mt-lg pt-md border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Belum memiliki akun warga? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Daftar Akun Baru</a>
</p>
</div>
</div>
<!-- Environmental Decorative Footer -->
<div class="mt-xl text-center opacity-40 select-none animate-fade-up stagger-3">
<div class="flex justify-center space-x-md mb-2">
<span class="material-symbols-outlined text-primary" data-icon="forest">forest</span>
<span class="material-symbols-outlined text-primary" data-icon="nature_people">nature_people</span>
<span class="material-symbols-outlined text-primary" data-icon="recycling">recycling</span>
</div>
<p class="font-label-caps text-[10px] uppercase tracking-widest text-secondary">Berpartisipasi Menjaga Keasrian Lingkungan</p>
</div>
</main>
<!-- Visual Polish: Soft Ambient Background Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-20 -left-20 w-96 h-96 bg-primary-fixed/20 rounded-full blur-[100px]"></div>
<div class="absolute top-1/2 -right-40 w-[500px] h-[500px] bg-tertiary-fixed/10 rounded-full blur-[120px]"></div>
</div>

</div>
</body></html>
