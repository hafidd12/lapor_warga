<script>
        // Micro-interactions for Filter Chips
        document.querySelectorAll('.no-scrollbar button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.no-scrollbar button').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-on-primary');
                    btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                });
                button.classList.add('bg-primary', 'text-on-primary');
                button.classList.remove('bg-secondary-container', 'text-on-secondary-container');
            });
        });

        // Atmospheric effect: Subtle scroll parallax for header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
                header.classList.remove('shadow-sm');
            } else {
                header.classList.add('shadow-sm');
                header.classList.remove('shadow-md');
            }
        });
