<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-mesh min-h-screen text-on-surface font-body-lg antialiased">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant/20 sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile h-16 max-w-max-width mx-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Pilih Peran</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="max-w-[600px] mx-auto px-margin-mobile py-xl flex flex-col items-center">
<!-- Brand Identity Section -->
<div class="text-center mb-xl">
<div class="w-20 h-20 bg-primary-container rounded-3xl flex items-center justify-center mx-auto mb-md shadow-lg">
<span class="material-symbols-outlined text-4xl text-on-primary-fixed" style="font-variation-settings: &quot;FILL&quot; 1;">eco</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">Selamat Datang</h2>
<p class="text-on-surface-variant font-body-lg">Silakan pilih peran Anda untuk mulai berkontribusi dalam menjaga lingkungan bersama.</p>
</div>
<!-- Role Selection Grid -->
<div class="w-full space-y-gutter">
<!-- Citizen Card (Warga) -->
<button class="role-card group w-full text-left bg-surface-container-lowest p-lg rounded-xl border-2 border-transparent shadow-[0_4px_12px_rgba(0,0,0,0.04)] hover:shadow-xl transition-all duration-300 flex items-start gap-md" onclick="window.location.href='#register-warga'">
<div class="icon-container w-14 h-14 shrink-0 rounded-xl bg-secondary-container text-primary flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-3xl text-primary">person</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-xs">
<h3 class="font-headline-md text-headline-md text-primary">Warga</h3>
<span class="material-symbols-outlined text-outline group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</div>
<p class="text-body-sm text-on-surface-variant leading-relaxed">Lapor masalah lingkungan, pantau perkembangan wilayah Anda, dan berpartisipasi dalam diskusi warga.</p>
</div>
</button>
<!-- Admin Card (RT/RW) -->
<button class="role-card group w-full text-left bg-surface-container-lowest p-lg rounded-xl border-2 border-transparent shadow-[0_4px_12px_rgba(0,0,0,0.04)] hover:shadow-xl transition-all duration-300 flex items-start gap-md" onclick="window.location.href='#register-rtrw'">
<div class="icon-container w-14 h-14 shrink-0 rounded-xl bg-secondary-container text-primary flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-3xl text-primary">shield_person</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-center mb-xs">
<h3 class="font-headline-md text-headline-md text-primary">RT/RW</h3>
<span class="material-symbols-outlined text-outline group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</div>
<p class="text-body-sm text-on-surface-variant leading-relaxed">Kelola laporan warga secara efisien, buat pengumuman resmi, dan adakan voting keputusan lingkungan.</p>
</div>
</button>
</div>
<!-- Decorative Illustration Placeholder -->

<footer class="mt-xl text-center pb-xl">
<p class="text-on-surface-variant font-body-sm">
                Sudah punya akun? 
                <a class="text-primary font-bold hover:underline ml-1" href="/login">Login</a>
</p>
</footer>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                // Potential for haptic feedback triggers or sound effects
            });
            
            card.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.classList.add('absolute', 'bg-primary/10', 'rounded-full', 'animate-ping');
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.left = `${e.clientX - card.getBoundingClientRect().left - 50}px`;
                ripple.style.top = `${e.clientY - card.getBoundingClientRect().top - 50}px`;
                card.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
