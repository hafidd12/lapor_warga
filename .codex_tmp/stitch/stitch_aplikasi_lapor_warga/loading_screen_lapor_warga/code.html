<!-- Loading Indicator -->

<!-- Progress Track Concept -->
<div class="h-1 w-full bg-on-primary/10 rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full bg-primary-fixed rounded-full transition-all duration-300 ease-out" id="progress-bar" style="width: 100%;"></div>

<span class="font-label-caps text-label-caps text-on-primary">Suara Warga, Solusi Bersama</span>
</div>
</footer>
<script>
        // Micro-interaction for loading simulation
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const loadingText = document.getElementById('loading-text');
            const texts = [
                "Menyiapkan modul pelaporan...",
                "Menghubungkan ke pusat data...",
                "Memverifikasi identitas warga...",
                "Menghubungkan komunitas...",
                "Hampir selesai..."
            ];
            
            let progress = 0;
            let textIndex = 0;

            const updateLoading = () => {
                if (progress < 100) {
                    // Randomized progress steps
                    progress += Math.floor(Math.random() * 15) + 5;
                    if (progress > 100) progress = 100;
                    
                    progressBar.style.width = `${progress}%`;
                    
                    // Update text occasionally
                    if (progress > (textIndex + 1) * 20 && textIndex < texts.length - 1) {
                        textIndex++;
                        loadingText.style.opacity = '0';
                        setTimeout(() => {
                            loadingText.innerText = texts[textIndex];
                            loadingText.style.opacity = '1';
                        }, 200);
                    }

                    const nextStep = Math.floor(Math.random() * 600) + 200;
                    setTimeout(updateLoading, nextStep);
                } else {
                    loadingText.innerText = "Sistem Siap";
                    loadingText.classList.add('text-primary-fixed');
                }
            };

            // Start simulation
            setTimeout(updateLoading, 800);
        });
    </script>
