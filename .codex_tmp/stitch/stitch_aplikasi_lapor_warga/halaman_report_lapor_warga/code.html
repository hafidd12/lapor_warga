                        "primary-fixed-dim": "#a5d0b9",
                        "surface-bright": "#f8f9fa",

                        "secondary-fixed-dim": "#bfc9c3",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#002d1b",

                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- Top AppBar -->
<header class="bg-surface shadow-sm flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-high transition-colors p-2 rounded-full active:opacity-80 active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Report</h1>
</div>
<div class="flex items-center">
<button class="hover:bg-surface-container-high transition-colors p-2 rounded-full active:opacity-80 active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</div>
</header>
<main class="max-w-[1200px] mx-auto px-margin-mobile py-lg">
<div class="space-y-lg">
<!-- Title Input -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/10">
<label class="block font-label-caps text-label-caps text-secondary mb-sm uppercase">Judul Laporan</label>
<input class="w-full p-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none text-body-lg placeholder:text-outline-variant transition-all" placeholder="Tuliskan judul laporan singkat atau subjek laporan..." type="text">
</section>
<!-- Detail Input -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/10">
<label class="block font-label-caps text-label-caps text-secondary mb-sm uppercase">Detail Laporan</label>
<textarea class="w-full h-32 p-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none text-body-lg resize-none placeholder:text-outline-variant transition-all" placeholder="Ceritakan detail kejadian atau masalah yang Anda temukan..."></textarea>
</section>
<!-- Priority Selection -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/10">
<label class="block font-label-caps text-label-caps text-secondary mb-sm uppercase">Prioritas</label>
<div class="flex bg-surface-container-low p-1 rounded-lg gap-1">
<button class="flex-1 py-2 text-body-sm font-button rounded-md transition-all bg-surface-container-lowest shadow-sm text-primary" onclick="selectSegment(this)">Rendah</button>
<button class="flex-1 py-2 text-body-sm font-button rounded-md transition-all text-secondary hover:bg-surface-container-high" onclick="selectSegment(this)">Sedang</button>
<button class="flex-1 py-2 text-body-sm font-button rounded-md transition-all text-secondary hover:bg-surface-container-high" onclick="selectSegment(this)">Tinggi</button>
</div>
</section>
<!-- Image Upload -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/10">
<label class="block font-label-caps text-label-caps text-secondary mb-sm uppercase">Unggah Foto</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl aspect-video flex flex-col items-center justify-center gap-2 text-outline hover:border-primary hover:text-primary transition-colors cursor-pointer group bg-surface-container-low/30">
<span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform">add_a_photo</span>
<span class="font-button text-button">Pilih Foto Kejadian</span>
</div>
</section>
<!-- Location Selection -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/10">
<label class="block font-label-caps text-label-caps text-secondary mb-sm uppercase">Pilih Lokasi</label>
<div class="relative rounded-xl overflow-hidden aspect-[16/9] group cursor-pointer border border-outline-variant">
<img alt="Map Preview" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqk3khg_jUYRZ7Wedvlju2akDIwpzx-oHQxg_-WC2gP5lBmCX4SDK5JyZia3l4I9Ms7J-8F5bhuMCPLDRZoHHCiFQbttDc-tbXbzV20b-hMk3-Fh09om6dJzJVgdsdrDuBI-aFTXBOfk_aDa5FuDKcz2wP8_ILrN4woF7sfekTDgOGjp07yAZoD7hdNKTjcbzD7EEOXsWVMA21ax2cik2sGBha_Fub0leX9VMKX8HShd-OYhrXoKxooJzKW5Tb9Yk4pF5emOSi-ZY">
<div class="absolute inset-0 bg-black/10 flex items-center justify-center group-hover:bg-black/20 transition-all">
<div class="bg-surface-container-lowest px-4 py-2 rounded-full flex items-center gap-2 shadow-lg active:scale-95 transition-transform border border-outline-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-button text-button text-primary">Tentukan Titik Lokasi</span>
</div>
</div>
</div>
</section>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-xl shadow-lg hover:opacity-90 transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">send</span>
                    Kirim Laporan
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl border-t border-outline-variant/20">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1.5 hover:bg-surface-container-high transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-[10px] mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-caps text-[10px] mt-1 font-bold">Report</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1.5 hover:bg-surface-container-high transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-[10px] mt-1">Activity</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1.5 hover:bg-surface-container-high transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-[10px] mt-1">Profile</span>
</a>
</nav>
<script>
        function selectSegment(btn) {
            const container = btn.parentElement;
            container.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                b.classList.add('text-secondary', 'hover:bg-surface-container-high');
            });
            btn.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
            btn.classList.remove('text-secondary', 'hover:bg-surface-container-high');
        }
    </script>
</body></html>
