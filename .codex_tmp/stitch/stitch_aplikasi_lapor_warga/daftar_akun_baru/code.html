<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Daftar Akun - Lapor Warga</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-background": "#191c1d",
                    "on-secondary-container": "#5b6560",
                    "on-primary-fixed": "#002114",
                    "outline": "#717973",
                    "surface-tint": "#3f6653",
                    "surface-bright": "#f8f9fa",
                    "surface-variant": "#e1e3e4",
                    "on-primary-container": "#86af99",
                    "inverse-primary": "#a5d0b9",
                    "tertiary-fixed": "#b0f1cc",
                    "secondary": "#57615c",
                    "on-tertiary-fixed": "#002113",
                    "primary-container": "#1b4332",
                    "on-secondary-fixed": "#151d1a",
                    "surface": "#f8f9fa",
                    "inverse-on-surface": "#f0f1f2",
                    "secondary-fixed-dim": "#bfc9c3",
                    "on-secondary-fixed-variant": "#3f4945",
                    "error": "#ba1a1a",
                    "surface-container": "#edeeef",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#d8e2dc",
                    "outline-variant": "#c1c8c2",
                    "primary-fixed": "#c1ecd4",
                    "on-tertiary-fixed-variant": "#0c5136",
                    "tertiary-fixed-dim": "#94d4b1",
                    "surface-container-highest": "#e1e3e4",
                    "surface-dim": "#d9dadb",
                    "surface-container-low": "#f3f4f5",
                    "tertiary": "#002d1b",
                    "secondary-fixed": "#dbe5df",
                    "on-surface": "#191c1d",
                    "primary": "#012d1d",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#2e3132",
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "tertiary-container": "#00452d",
                    "primary-fixed-dim": "#a5d0b9",
                    "on-error": "#ffffff",
                    "background": "#f8f9fa",
                    "on-surface-variant": "#414844",
                    "on-primary-fixed-variant": "#274e3d",
                    "surface-container-high": "#e7e8e9",
                    "on-tertiary-container": "#74b392"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "40px",
                    "lg": "24px",
                    "margin-mobile": "16px",
                    "margin-desktop": "64px",
                    "sm": "8px",
                    "xs": "4px",
                    "unit": "4px",
                    "md": "16px",
                    "gutter": "16px",
                    "max-width": "1200px"
            },
            "fontFamily": {
                    "label-caps": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "button": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "button": ["15px", {"lineHeight": "20px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ambient-shadow {
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .form-focus-ring:focus-within {
            border-color: #1b4332;
            box-shadow: 0 0 0 1px #1b4332;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col">
<!-- Top Navigation Placeholder (Back Button Only for Transactional Flow) -->
<header class="w-full max-w-max-width mx-auto px-margin-mobile md:px-margin-desktop py-6 flex items-center">
<button aria-label="Kembali ke login" class="p-2 -ml-2 hover:bg-surface-container-high rounded-full transition-colors flex items-center justify-center text-on-surface" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pb-12">
<div class="w-full max-w-md">
<!-- Branding & Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-primary-container mb-md shadow-lg transform transition-transform hover:scale-105 duration-300">
<span class="material-symbols-outlined text-primary-fixed-dim text-5xl" data-icon="eco">eco</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Daftar Akun Baru</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Mari berkontribusi menciptakan lingkungan yang lebih baik bersama Lapor Warga.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 md:p-8 ambient-shadow border border-outline-variant/30">
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="name">NAMA LENGKAP</label>
<div class="relative group">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm" id="name" placeholder="Budi Santoso" type="text">
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="email">EMAIL</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm" id="email" placeholder="budi@example.com" type="email">
</div>
<!-- Row: Phone & Address -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="phone">NOMOR HP</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm" id="phone" placeholder="0812..." type="tel">
</div>
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="rtrw">RT/RW</label>
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm" id="rtrw" placeholder="001/002" type="text">
</div>
</div>
<!-- Password -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="password">PASSWORD</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm pr-12" id="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-secondary ml-1" for="confirm_password">KONFIRMASI PASSWORD</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:outline-none transition-all form-focus-ring font-body-sm pr-12" id="confirm_password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword('confirm_password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 pt-2">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container" id="terms" type="checkbox">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            Saya setuju dengan <a class="text-primary-container font-semibold hover:underline" href="#">Syarat &amp; Ketentuan</a> serta Kebijakan Privasi yang berlaku.
                        </label>
</div>
<!-- CTA Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary hover:opacity-90 active:scale-95 transition-all py-4 rounded-lg font-button text-button shadow-md flex justify-center items-center gap-2" type="submit">
<span class="">Daftar Sekarang</span>
<span class="material-symbols-outlined text-[18px]">person_add</span>
</button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="text-center mt-8">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Sudah punya akun? 
                    <a class="text-primary-container font-bold hover:underline ml-1" href="#">Masuk</a>
</p>
</div>
</div>
</main>
<!-- Background Illustration (Subtle Leaf Pattern) -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-[0.03] overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-tertiary rounded-full blur-3xl"></div>
<div class="flex flex-wrap justify-center items-center w-full h-full gap-24 transform rotate-12">
<!-- Repeated Leaf Icons -->
<span class="material-symbols-outlined text-9xl">eco</span>
<span class="material-symbols-outlined text-9xl">nature</span>
<span class="material-symbols-outlined text-9xl">park</span>
<span class="material-symbols-outlined text-9xl">spa</span>
</div>
</div>
<script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Simple button active state animation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>


</body></html>
