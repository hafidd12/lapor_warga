<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ambient-shadow {
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .active-shadow {
            box-shadow: 0 8px 24px rgba(27, 67, 50, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface">
<!-- Top AppBar -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile h-16 shadow-sm">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" data-icon="menu">menu</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Profil Admin</h1>
</div>
<div class="flex items-center gap-2">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" data-icon="notifications">notifications</button>
</div>
</header>
<!-- Main Content -->
<main class="max-w-max-width mx-auto px-margin-mobile py-lg pb-32">
<!-- Profile Hero Section -->
<!-- Account Settings Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Account Settings Card -->
<!-- Admin Stats Card -->
<!-- System Preferences -->
<section class="bg-surface-container-lowest rounded-xl p-lg ambient-shadow">
<h3 class="font-headline-md text-headline-md text-primary mb-md">Preferences</h3>
<div class="flex flex-col md:flex-row gap-gutter">
<div class="flex-1 p-4 border border-outline-variant/30 rounded-xl hover:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="material-symbols-outlined text-primary" data-icon="dark_mode">dark_mode</span>
<input class="w-10 h-5 bg-outline-variant/30 rounded-full appearance-none cursor-pointer relative checked:bg-primary before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-0.5 before:left-0.5 before:transition-transform checked:before:translate-x-5" type="checkbox"/>
</div>
<p class="font-body-lg text-body-lg text-on-surface">Dark Interface</p>
<p class="font-body-sm text-body-sm text-secondary">Enable high-contrast night mode</p>
</div>
<div class="flex-1 p-4 border border-outline-variant/30 rounded-xl hover:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="material-symbols-outlined text-primary" data-icon="language">language</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface">Bahasa Indonesia</p>
<p class="font-body-sm text-body-sm text-secondary">Default system language</p>
</div>
<div class="flex-1 p-4 border border-outline-variant/30 rounded-xl hover:border-primary/50 transition-colors">
<div class="flex items-center justify-between mb-2">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface">Region Tracking</p>
<p class="font-body-sm text-body-sm text-secondary">Focus on Jakarta area reports</p>
</div>
</div>
</section>
<!-- Danger Zone -->
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest shadow-lg border-t border-outline-variant/20 rounded-t-xl">
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high p-2 rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high p-2 rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps mt-1">Activity</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-label-caps mt-1 font-bold">Profile</span>
</a>
</nav>
<script>
        // Micro-interactions
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('click', (e) => {
                if (elem.classList.contains('active:scale-95')) return;
                elem.classList.add('scale-95', 'opacity-80');
                setTimeout(() => {
                    elem.classList.remove('scale-95', 'opacity-80');
                }, 150);
            });
        });

        // Simple Tab active simulation
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                navItems.forEach(nav => {
                    nav.className = "flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high p-2 rounded-lg transition-colors";
                    const icon = nav.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                this.className = "flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1";
                const activeIcon = this.querySelector('.material-symbols-outlined');
                if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
